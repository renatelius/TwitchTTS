<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чат для OBS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
<style>
  /* Прозрачная страница для источника «Браузер» в OBS. Звук здесь не играет — он идёт с главной страницы.
     Параметры в адресе: ?size=26 — размер шрифта, ?all=1 — показывать и неозвученные сообщения. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 700 24px/1.35 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #fff;
  }
  #chat {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .msg {
    background: rgba(11, 12, 16, .62);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 10px; padding: 6px 12px;
    width: fit-content; max-width: 100%;
    word-break: break-word; text-shadow: 0 1px 2px #000;
    border-left: 4px solid transparent;
    animation: in 320ms cubic-bezier(.2, .7, .3, 1);
  }
  .msg.speaking { border-left-color: #8b5cf6; background: rgba(60, 36, 110, .8); }
  .msg.hl { border-left-color: #f59e0b; background: rgba(120, 53, 15, .78); }
  .msg.pin { border-left-color: #f59e0b; background: rgba(120, 53, 15, .9); font-weight: 700; }
  .msg { cursor: pointer; }
  .nick { margin-right: 8px; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
</style>
</head>
<body>
<div id="chat"></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('size')) document.body.style.fontSize = (+q.get('size') || 24) + 'px';
const showAll = q.get('all') === '1';
const chat = document.getElementById('chat');
function add(ev) {
  if (!ev.tts && !ev.highlight && !showAll) return;
  const d = document.createElement('div'); d.className = 'msg'; d.dataset.id = ev.id;
  if (ev.highlight) d.classList.add('hl');
  const n = document.createElement('span'); n.className = 'nick'; n.textContent = ev.user + ':'; n.style.color = ev.color || '#c4b5fd';
  d.append(n, document.createTextNode(ev.text)); chat.append(d);
  d.title = 'Клик - убрать сообщение';
  d.onclick = () => d.remove();
  trim();
}
function trim() {
  const msgs = chat.querySelectorAll('.msg:not(.pin)');
  while (msgs.length > 12) {
    const victim = Array.from(chat.children).find(x => !x.classList.contains('pin'));
    if (!victim) break;
    victim.remove();
  }
}
function pin(ev) {
  chat.querySelectorAll('.msg.pin').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'msg pin';
  const n = document.createElement('span'); n.className = 'nick'; n.textContent = (ev.user || '') + ':'; n.style.color = ev.color || '#fbbf24';
  d.append(n, document.createTextNode(ev.text || ''));
  chat.prepend(d);
}
function mark(id, on) {
  const e = chat.querySelector('[data-id="' + CSS.escape(id) + '"]'); if (e) e.classList.toggle('speaking', on);
}
new EventSource('/events').onmessage = m => {
  const ev = JSON.parse(m.data);
  if (ev.type === 'chat') add(ev);
  else if (ev.type === 'pin') pin(ev);
  else if (ev.type === 'speak') mark(ev.id, true);
  else if (ev.type === 'done') mark(ev.id, false);
};
</script>
</body>
</html>
